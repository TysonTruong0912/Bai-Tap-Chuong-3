<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="dangky.css">
</head>

<body>

<div class="container">

    <h1>Đăng ký tài khoản mới</h1>

    <main>

        <section>

            <form action="xu_ly_dangky.php"
                  method="POST"
                  enctype="multipart/form-data"
                  name="formDangKy"
                  id="formDangKy">

                <fieldset>

                    <legend>Thông tin cơ bản</legend>

                    <div class="row">
                        <label for="hoten">Họ và tên:</label>

                        <input type="text"
                               id="hoten"
                               name="hoten"
                               placeholder="Nguyễn Văn An"
                               required
                               maxlength="100">
                    </div>

                    <div class="row">
                        <label for="email">Email:</label>

                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="example@gmail.com"
                               required>
                    </div>

                    <div class="row">
                        <label for="matkhau">Mật khẩu:</label>

                        <input type="password"
                               id="matkhau"
                               name="matkhau"
                               minlength="8"
                               required>
                    </div>

                    <div class="row">
                        <label for="sdt">Số điện thoại:</label>

                        <input type="tel"
                               id="sdt"
                               name="sdt"
                               pattern="[0-9]{10}"
                               placeholder="0901234567">
                    </div>

                </fieldset>

                <fieldset>

                    <legend>Thông tin cá nhân</legend>

                    <div class="row">
                        <label for="tuoi">Tuổi:</label>

                        <input type="number"
                               id="tuoi"
                               name="tuoi"
                               min="16"
                               max="99"
                               step="1"
                               value="18">
                    </div>

                    <div class="row">
                        <label for="ngaysinh">Ngày sinh:</label>

                        <input type="date"
                               id="ngaysinh"
                               name="ngaysinh"
                               min="1950-01-01"
                               max="2010-12-31">
                    </div>

                    <div class="row">

                        <label>Giới tính:</label>

                        <div class="radio-group">

                            <label>
                                <input type="radio"
                                       name="gioitinh"
                                       value="nam">
                                Nam
                            </label>

                            <label>
                                <input type="radio"
                                       name="gioitinh"
                                       value="nu">
                                Nữ
                            </label>

                            <label>
                                <input type="radio"
                                       name="gioitinh"
                                       value="khac">
                                Khác
                            </label>

                        </div>

                    </div>

                    <div class="row">

                        <label for="mauyeuthich">
                            Màu yêu thích:
                        </label>

                        <input type="color"
                               id="mauyeuthich"
                               name="mauyeuthich"
                               value="#FF6B6B">

                    </div>

                </fieldset>

                <fieldset>

                    <legend>Sở thích & Cài đặt</legend>

                    <div class="row">

                        <label for="timkiem">
                            Tìm kiếm sở thích:
                        </label>

                        <input type="search"
                               id="timkiem"
                               name="timkiem"
                               placeholder="Ví dụ: đọc sách, chơi game...">

                    </div>

                    <div class="row">

                        <label for="mucchitieu">
                            Mức chi tiêu/tháng:
                        </label>

                        <input type="range"
                               id="mucchitieu"
                               name="mucchitieu"
                               min="0"
                               max="50000000"
                               step="500000"
                               value="5000000">

                        <span>5.000.000</span>

                    </div>

                    <div class="row">

                        <label>Sở thích (chọn nhiều):</label>

                        <div class="check-group">

                            <label>
                                <input type="checkbox"
                                       name="sothich[]"
                                       value="doc_sach">
                                Đọc sách
                            </label>

                            <label>
                                <input type="checkbox"
                                       name="sothich[]"
                                       value="choi_game">
                                Chơi game
                            </label>

                            <label>
                                <input type="checkbox"
                                       name="sothich[]"
                                       value="du_lich">
                                Du lịch
                            </label>

                        </div>

                    </div>

                    <div class="row">

                        <label for="website">
                            Website cá nhân:
                        </label>

                        <input type="url"
                               id="website"
                               name="website"
                               placeholder="https://example.com">

                    </div>

                    <div class="row">

                        <label for="avatar">
                            Ảnh đại diện:
                        </label>

                        <input type="file"
                               id="avatar"
                               name="avatar"
                               accept="image/png, image/jpeg">

                    </div>

                </fieldset>

                <div class="buttons">

                    <button type="submit" class="submit">
                        Đăng ký ngay
                    </button>

                    <button type="reset" class="reset">
                        Nhập lại
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

</body>
</html>
